<div id="app_bids">

	<div id="TenderCountdown" class="ui-corner-top" style="float:left;width:236px;padding:1px;overflow:auto;z-index:1000">
		<script type="text/javascript">
			function highlightLast(periods) {
				if ($.countdown.periodsToSeconds(periods) < 60) {
					$(this).addClass('lastseconds');
				}
			}

			function RefreshBids() {
				$.blockUI({
					centerY: 0,
					css: {
						background: '#ff0084 url(../images/ajax-loader.gif) no-repeat',
						border: 'none',
						padding: '2px',
						width: '160px',
						top: '4px',
						right: '4px',
						left: '',
						'-webkit-border-radius': '4px',
						'-moz-border-radius': '4px'
					}
				});
				setTimeout('ShowApp(681326,\'\',2)', 1000);
			}

			$('#TenderCountdown').countdown({
				until: +422984,
				onExpiry: RefreshBids,
				onTick: highlightLast,
				alwaysExpire: false,
				description: 'მიმდინარეობს ძირითადი დრო'
			});
		</script>
	</div>

	<p align="right">
		<button type="button" id="refrsh">გვერდის განახლება</button>
		<button type="button" id="showtdocs">ტექნიკური დოკუმენტაცია</button>
	</p>

	<div id="app_tdocs" style="margin-top:3em;"></div>
	
	
	
	

	<table width="100%" border="0" cellspacing="1" cellpadding="6" class="ktable" style="margin-bottom:2em">
		<thead>
			<tr class="ui-widget-header">
				<td>პრეტენდენტი</td>
				<td>ბოლო შეთავაზება<br />თანხა/დრო</td>
				<td>პირველი შეთავაზება<br />თანხა/დრო</td>
				<td align="center">შეთავაზებები</td>
			</tr>
		</thead>
		<tbody>
			
		</tbody>
	</table>
</div>


<script type="text/javascript">
	$(document).ready(function () {
		$('#refrsh').button({
			icons: {
				primary: "ui-icon-refresh"
			}
		}).click(function () {
			ShowApp(681326, '', 2)
		});
		$('#showtdocs').button({
			icons: {
				primary: "ui-icon-triangle-1-s"
			}
		}).click(function () {
			$.get('library/controller.php', {
				action: 'app_tdocs',
				app_id: 681326
			}, function (data) {
				$('#app_tdocs').html(data);
			});
		})
	});

	function ShowBidHistory(bid, app) {
		var targetelm = 'B' + bid + app;
		var targetcontainer = targetelm + 'C';
		$('#' + targetcontainer).parent().remove();
		$('#' + targetelm).after('<tr><td colspan="5" id="' + targetcontainer + '"></td></tr>');
		$.get('library/controller.php', {
			action: 'view_bid',
			app_id: bid,
			bid_id: app
		}, function (data) {
			$('#' + targetcontainer).html(data);
		});
	}
</script>
