# --- TENDER DETAIL TAB MODEL (confirmed 2026-05-28) ---
# A tender loads via action=application&app_id=<id>&app_reg=&key= which builds a jQuery UI
# tabs widget. The tab set is STATE-DEPENDENT:
#   Always present: app_main, app_docs, app_bids (შეთავაზებები), agency_docs (შედეგები)
#   Conditional:    agr_docs (ხელშეკრულება) — appears ONLY once a contract is signed.
# Verified across 4 states (fixtures in data/discovery/):
#   awarded         656756 -> 5 tabs (agr_docs present)
#   bidding-phase   681326 -> 4 tabs (no agr_docs; app_bids shows live countdown)
#   failed-contract 681857 (app_agr_status=30) -> 5 tabs; agr_docs PRESENT (contract signed then failed)
#   did-not-happen  685227 (app_status=110)   -> 4 tabs (no agr_docs; never reached a contract)
# So agr_docs presence == "a contract was ever signed", regardless of later contract outcome.
