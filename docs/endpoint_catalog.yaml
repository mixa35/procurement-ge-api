# Machine-readable inventory of every reverse-engineered endpoint under the
# შესყიდვები (Procurement) section of tenders.procurement.gov.ge.
#
# This file is the source of truth the Python client (tenders_client/) is checked
# against. Human-readable prose lives in api_reference.md; raw HTML examples in
# html_structure.md. Keep all three in sync.
#
# status values:
#   documented        — all 7 definition-of-done criteria captured & verified
#   needs_reverify    — documented previously, not re-confirmed this pass
#   in_progress       — actively being discovered
#   not_discovered    — known to exist, action/params unknown
#
# Each endpoint's definition of done (must all be true before status: documented):
#   method+url, every param, response shape, empty state, error state,
#   auth requirement, captured fixture path.
#
# NOTE ON `fixture:` PATHS — the data/discovery/*.html paths below name where each
# response was captured during the original discovery run. That bulk HTML is NOT
# shipped in this bundle (we don't redistribute scraped pages). A curated subset
# backing the test suite lives in tests/fixtures/, and the capture scripts that
# produced them are in provenance/discovery/. Regenerate any fixture by re-running
# the matching provenance/discovery/ script against the live portal.

meta:
  base_url: https://tenders.procurement.gov.ge/public/library/controller.php
  session:
    cookie: SPALITE
    acquire: GET https://tenders.procurement.gov.ge/public/?lang=ge
    note: Reuse the SPALITE cookie on all controller.php calls. Missing cookie -> PHP error.
  encoding: utf-8
  thousands_separator: "`"   # backtick, e.g. 7`500.00 ლარი
  throttle_seconds: 1.5
  auth: public   # all endpoints below confirmed reachable anonymously

endpoints:

  - id: company_lookup
    status: documented
    last_verified: "2026-05-29"
    method: GET
    url: https://tenders.procurement.gov.ge/public/library/list_org.php
    action: null
    params:
      - {name: q,       required: true, default: null, values: "reg code OR name substring (min 3 chars)", note: matches reg code or org name}
      - {name: orgtype, required: true, default: "1",  values: "0,1,2,3,4 (see note)", note: "orgtype variants confirmed 2026-05-28"}
    orgtype_values:   # confirmed by probing q='თბილისის მუნიციპალიტეტი'
      "0": broad match across all roles (largest result set)
      "1": supplier-role registry (used to resolve app_monac_id)
      "2": buyer-role registry (smaller subset)
      "3": broad match (similar to 0, slightly fewer)
      "4": empty (no rows)
    ui_usage:   # CORRECTION (2026-05-29): which orgtype the live SPA actually sends
      org_a_buyer_box: "orgtype=3  (the buyer-name autocomplete #org_a fills app_shems_id)"
      org_b_supplier_box: "orgtype=1  (the supplier-name autocomplete #org_b fills app_monac_id)"
      note: >
        The site's buyer search box uses orgtype=3 (broad), NOT orgtype=2, even though 2 is the
        buyer-role registry. To mirror the UI exactly use 3 for buyer / 1 for supplier.
    response:
      format: pipe-delimited text
      shape: "internal_id|name|reg_code|\\n"   # one record per line, trailing pipe + newline
      note: first field is the portal-internal id used as app_monac_id (supplier) or app_shems_id (buyer).
    empty_state: "empty body (0 bytes)"
    error_state: not_captured
    fixture: null

  - id: search_app
    status: documented
    last_verified: "2026-05-29"
    method: POST
    url: https://tenders.procurement.gov.ge/public/library/controller.php
    action: search_app
    content_type: application/x-www-form-urlencoded
    note: "All 22 params are always sent, even when empty. Full enum tables in api_reference.md."
    authoritative_filter_map: "docs/search_filters.json + docs/search_filters.md — EVERY filter (georgian label <-> param) and EVERY option (internal id <-> georgian name) scraped live from #search_frm by provenance/discovery/extract_filters.py. Regenerate to refresh. <select> values are INTERNAL IDS, not the visible numbers."
    params:
      - {name: action,                 required: true,  default: search_app, note: fixed}
      - {name: app_t,                  required: true,  default: "0",        note: fixed}
      - {name: search,                 required: false, default: "",         note: hidden free-text, normally empty}
      - {name: app_reg_id,             required: false, default: "",         note: "tender announcement number. CORRECTION 2026-05-29: matches the NUMERIC part only, ignoring the type prefix — app_reg_id=NAT250000613 returns GEO/CON/SPA/NAT 250000613 alike. Filter results by exact nat_code to disambiguate."}
      - {name: app_shems_id,           required: false, default: "0",        note: BUYER internal id; set by org_a autocomplete}
      - {name: org_a,                  required: false, default: "",         note: buyer name search box (min 3 chars), fills app_shems_id}
      - {name: app_monac_id,           required: false, default: "0",        note: SUPPLIER internal id; from list_org.php orgtype=1}
      - {name: org_b,                  required: false, default: "",         note: supplier name search box (min 3 chars), fills app_monac_id}
      - {name: app_particip_status_id, required: false, default: "0",        values: "0/200/100", note: supplier status enum}
      - {name: app_donor_id,           required: false, default: "0",        values: "16 donors", note: see donor enum}
      - {name: app_status,             required: false, default: "0",        values: "0,10,20,30,40,50,100,110,120,130,140", note: procurement status enum}
      - {name: app_agr_status,         required: false, default: "0",        values: "0,10,20,30,40", note: contract status enum}
      - {name: app_type,               required: false, default: "0",        values: "16 types (NAT/SPA/CON/...)", note: procurement type enum}
      - {name: app_basecode,           required: false, default: "0",        values: "273 CPV categories (value=INTERNAL ID, not the CPV number)", note: "the 'შესყიდვის კატეგორია' dropdown. BROAD category = all sub-codes of that CPV group. Resolve CPV->id via docs/cpv_basecode_map.json (e.g. 45200000 -> 19003) or client.resolve_basecode(). VERIFIED 2026-05-29: app_basecode=19003 + status130 = 182 results (matches UI)."}
      - {name: app_codes,              required: false, default: "",         note: "comma-separated raw CPV codes = EXACT code match (narrower than app_basecode). e.g. app_codes=45200000 + status130 = 77 (vs 182 for the 19003 category). Use app_basecode to mirror the UI dropdown."}
      - {name: app_date_type,          required: false, default: "1",        values: "1=registration, 2=trade, 3=status", note: ""}
      - {name: app_date_from,          required: false, default: "",         values: "DD.MM.YYYY", note: server-side date filter}
      - {name: app_date_tlll,          required: false, default: "",         values: "DD.MM.YYYY", note: "till date - triple-L typo (input id is app_date_till)"}
      - {name: app_amount_from,        required: false, default: "",         values: numeric, note: ""}
      - {name: app_amount_to,          required: false, default: "",         values: numeric, note: ""}
      - {name: app_currency,           required: false, default: "2",        values: "2 observed", note: hidden}
      - {name: app_pricelist,          required: false, default: "0",        values: "0=all, 1=with, 2=without", note: ""}
    pagination:
      param: page
      method: GET
      values: "next | prev | <numeric page index> (btn_last sends the last-page number)"
      state: "result set held server-side in session; page nav is GET action=search_app&page=<v>"
      total_indicator: "button text 'N ჩანაწერი (გვერდი: CUR/TOTAL)' -> digits after '/'"
      buttons: [btn_first, btn_prev, btn_next, btn_last]
    response:
      format: html_fragment
      table: "table#list_apps_by_subject tbody"
      row_id: "tr[id] -> strip leading 'A'; row also has onclick=ShowApp(<app_id>,'',0)"
      per_page: 4
      status_icon: "img src=images/statuses/stat<N>.png"
    stat_icon_mapping:   # RESOLVED 2026-05-29 (was medium-priority TBD)
      note: >
        The stat<N>.png icon number is IDENTICAL to the app_status filter value (1:1).
        Verified by searching once per app_status value: filter 10 -> stat10.png,
        20 -> stat20.png, ... 140 -> stat140.png. No separate icon->status table needed.
      fixture: data/discovery/stat_icon_mapping.txt
    cpv_helpers:   # backends for the app_codes / app_basecode CPV inputs (see cpv_* endpoints)
      autocomplete: "library/cpv/cpv_search.php (q,limit) -> feeds the app_codes text field"
      tree_picker:  "library/cpv/dialog2.php (POST input_id,code_str[,cpvlang=2]) -> dynatree dialog (#cpv_dialog)"
      basecode_map: "docs/cpv_basecode_map.json — 273 categories {id:{cpv,name}} scraped from the app_basecode <select> on the homepage. CPV number -> internal id. Rebuild via client.cpv_categories(). Use client.search_by_category(cpv, **filters) to filter by the dropdown."
      basecode_vs_codes: "app_basecode = BROAD category (all sub-codes); app_codes = EXACT code. They give different counts — pick deliberately."
    empty_state: "single row text 'ჩანაწერები არ არის'"
    error_state: "no error fixture for malformed search body (filters are tolerant; unknown enum value -> empty result set)"
    fixture: data/discovery/search_app_default_p1.html

  - id: app_main
    status: documented
    last_verified: "2026-05-29"
    method: GET
    url: https://tenders.procurement.gov.ge/public/library/controller.php
    action: app_main
    params:
      - {name: action, required: true, default: app_main, values: app_main, note: fixed}
      - {name: app_id, required: true, default: null,     values: numeric, note: tender id}
      - {name: app_reg, required: false, default: "",     values: null, note: ""}
      - {name: key,     required: false, default: "",     values: null, note: ""}
    response:
      format: html_fragment
      wrapper: "div#app_main"
      table: "div#print_area > table.ktable.with-label tbody"
      key_value_rows: "each tr has td[0]=Georgian label, td[1]=value"
      fields:
        nat_code:        "label='განცხადების ნომერი'  -> strong text"
        status:          "label='შესყიდვის სტატუსი'   -> img[src] (stat*.png) + text"
        buyer:           "label='შემსყიდველი'         -> a[onclick=ShowProfile(id)] text"
        bid_start:       "label='წინადადებების მიღება იწყება'   -> td text DD.MM.YYYY HH:MM"
        bid_deadline:    "label='წინადადებების მიღება მთავრდება' -> td text DD.MM.YYYY HH:MM"
        est_value:       "label='შესყიდვის სავარაუდო ღირებულება' -> span text (backtick thousands; currency suffix GEL *or* ლარი — inconsistent, strip either)"
        cpv:             "label='შესყიდვის კატეგორია' -> td.subject_name"
        description:     "colspan=2 row -> div.blabla text"
      optional_fields:   # verified live 2026-06-01; present per-tender, match by label (open-ended map, not fixed schema)
        proc_type:       "label='შესყიდვის ტიპი'"
        announce_date:   "label='შესყიდვის გამოცხადების თარიღი'"
        vat_basis:       "label='წინადადება წარმოდგენილი უნდა იყოს' (დღგ-ს გათვალისწინებით/გარეშე)"
        cpv_codes:       "label='კლასიფიკატორის კოდები' -> list of CPV codes"
        delivery_term:   "label='მოწოდების ვადა'"
        quantity:        "label='შესყიდვის რაოდენობა ან მოცულობა'"
        extra_info:      "label='დამატებითი ინფორმაცია' (free text)"
        bid_step:        "label='შეთავაზების ფასის კლების ბიჯი' (price-reduction step)"
        guarantee_amt:   "label='გარანტიის ოდენობა' (bid-guarantee amount)"
        guarantee_term:  "label='გარანტიის მოქმედების ვადა' (days)"
      type_variant_fields:   # verified live 2026-06-01 — label set differs by tender TYPE; do NOT hardcode buyer/value labels
        grant_donor: "GRA & DEP add: დონორი (donor), პროგრამის დასახელება (program), 'ლოტის დასახალება / N:' (lot), პროექტის ხანგრძლივობა (project duration)"
        grant_buyer_label: "GRA replaces the buyer row 'შემსყიდველი' with 'ადმინისტრირებას უწევს' (administered by) — a buyer lookup keyed on 'შემსყიდველი' returns NOTHING for GRA. GRA also omits category/CPV, guarantee, bid-step"
        pricelist: "price-list (პრეისკურანტი) tenders rename the value row to 'პრეისკურანტის სავარაუდო ღირებულება' and add 'შესყიდვის ობიექტის სახელშეკრულებო ღირებულება' — exact match on 'შესყიდვის სავარაუდო ღირებულება' misses the estimate"
        b2b: "B2B omits the guarantee rows (shorter table); keeps შემსყიდველი, category, bid-step"
      footer: "ul.date -> li[0]=created (ჩაწერა: author :: DD.MM.YYYY HH:MM), li[1]=last modified (შესწორება: ...)"
      also: "Button #btn_appstatushistory fires action=app_statushistory (see that endpoint)"
    empty_state: n/a
    error_state: "invalid app_id -> PHP 'Undefined offset: 0' (controller.php line 140), not a 404"
    fixture: "data/discovery/app_main_656756.html (awarded); app_main_681326.html (bidding); app_main_681857.html (failed-contract); app_main_685227.html (did-not-happen)"

  - id: app_docs
    status: documented
    last_verified: "2026-05-29"
    method: GET
    url: https://tenders.procurement.gov.ge/public/library/controller.php
    action: app_docs
    params:
      - {name: action, required: true, default: app_docs, values: app_docs, note: fixed}
      - {name: app_id, required: true, default: null,     values: numeric, note: tender id}
      - {name: key,    required: false, default: "",      values: null, note: ""}
    response:
      format: html_fragment
      wrapper: "div#app_docs"
      layouts:   # IMPORTANT (confirmed 2026-05-29): app_docs has TWO shapes, driven by tender TYPE (+ era)
        sectioned:
          applies_to: "NAT, SPA, CON (the structured-announcement e-tender types), recent era"
          structure: "section.question.level1 (#que100/que50=1.1, #que101=1.2, #que150=1.3 cost estimates, #que200=1.4, ...)"
          file_anchor: "section#que150 div.answ-file > section > div[class^='obsolete'] > a"
          obsolete_flag: "obsolete0=current (keep), obsolete1=superseded (skip)"
          file_download: "library/files.php?mode=que&file=<FILE_ID>&code=<CODE>"
          cost_estimate: "files under section#que150 (1.3 ფასების ცხრილი/ხარჯთაღრიცხვა) — usually 1 xlsx, sometimes several"
          other_sections: >
            §1.3 is one of MANY sections (verified live 2026-06-01). Valuable buyer files also live
            elsewhere on the tab: §1.2 technical-spec block (project/geology/structural PDFs), annex
            templates (დანართი N3 გამოცდილება, N4 ამხანაგობა, N6 გრაფიკი), a draft contract
            (ხელშეკრულების პროექტი.pdf), and §11.1 the commission ოქმი approving conditions. So ოქმი /
            contract drafts are NOT exclusive to Results — they appear in app_docs too. get_doc_files
            targets §1.3 only; widen the selector for the full buyer package.
          qa_empty_string: "'დოკუმენტაცია მიმაგრებული არ არის' is ALSO the per-section Q&A (hst-blk) empty-state — not proof the tab has no documents"
        flat:
          applies_to: "GEO, DEP, MEP, DAP, TEP, CNT, GRA, B2B — AND any old/legacy tender (e.g. 2014 SPA) regardless of type"
          structure: "div.pad4px > table#tender_docs (ktable): cols მიმაგრებული ფაილები (file <a>) | თარიღი/ავტორი; plus a 'გამონაკლისის/გამოცხადების დამადასტურებელი დოკუმენტი' block and a div#chat Q&A section"
          file_anchor: "table#tender_docs a[href*='files.php'] — uses mode=app (NOT mode=que)"
          cost_estimate: "no #que150 section — the cost xlsx is just one row, name contains 'ხარჯთაღრიცხვა' or 'ფასების ცხრილი'"
      type_layout_map:   # sampled live 2026-05-29 (first recent tender of each type)
        sectioned: [NAT, SPA, CON]
        flat: [GEO, DEP, MEP, DAP, TEP, CNT, GRA, B2B]
        era_caveat: "old tenders use flat even for NAT/SPA/CON (verified: SPA140022279 from 2014 = flat; recent SPA = sectioned). Detect layout STRUCTURALLY, never assume by type alone."
        lifecycle_caveats:   # verified live 2026-06-01
          CON: "Consolidated tenders were observed at statuses up to 130 (preparing contract) but NONE at 140 (signed) — they do not produce the standard signed-contract / agr_docs (5-tab) state. Their contract handling differs (likely per-participant contracts elsewhere); terminal/contract flow is UNEXPLORED."
          PPP: "PPP type is defined in the search dropdown but currently returns 0 tenders — layout/structure never sampled (omit from layout assumptions)."
      qa_blocks: "sectioned: div.hst-blk id='hst-<chat_id>' per section; flat: div#chat with question blocks. Both expose .show_reply -> action=show_qa filling div#ANS<chat_id> (see show_qa)."
    empty_state: "sectioned: section#que150 absent/empty -> no estimate. flat: table#tender_docs absent -> 'დოკუმენტაცია მიმაგრებული არ არის'"
    error_state: "invalid app_id -> PHP 'Undefined offset: 0', not a 404"
    parser: "tenders_client get_doc_files(app_id) -> DocsTab(layout, files[DocFile]) handles both; .cost_estimate_files selects 1.3/xlsx across layouts"
    fixture: "data/discovery/app_docs_612033_sectioned.html (NAT); app_docs_125688_flat.html (SPA 2014 + Q&A); app_docs_687393_flat_b2b.html (B2B); app_docs_656756.html (NAT awarded)"

  - id: show_qa         # clarification Q&A reply thread for a documentation section
    status: documented
    last_verified: "2026-05-29"
    method: GET
    url: https://tenders.procurement.gov.ge/public/library/controller.php
    action: show_qa
    params:
      - {name: action,  required: true, default: show_qa, note: fixed}
      - {name: app_id,  required: true, default: null, values: numeric, note: tender id}
      - {name: chat_id, required: true, default: null, values: numeric, note: "the hst-blk id (div.hst-blk id='hst-<chat_id>' in app_docs)"}
    response:
      format: html_fragment
      populated: "one or more answer blocks: div.ui-widget-content...A.type3 > p.author.color-1 (span.date + buyer org :: person) + p.chatmessgase (answer text). 'A type3'=answer (vs 'Q type1'=question in app_docs #chat)."
      note: "Reply thread (answers) for one clarification question. Filled into #ANS<chat_id> by the .show_reply toggle button."
    empty_state: "<p class='color-2'><hr/>პასუხები არ არის</p>  (no answers)"
    error_state: "stale lang session -> PHP 'Undefined index: lang' line 8 (re-init session)"
    note: >
      Discovered 2026-05-29 by grepping app_docs. Trigger: .show_reply button id '<x>_<app_id>_<chat_id>'
      -> $.get(controller.php,{action:'show_qa',app_id,chat_id}). The question itself lives in app_docs
      (flat layout: div#chat 'Q type1' blocks; sectioned: per-section hst-blk). chat_id = the hst/ANS id.
    fixture: "data/discovery/show_qa_656756_23295158.html (empty); show_qa_125688_25710.html (populated answer)"

  - id: application     # tender container / session primer
    status: documented
    last_verified: "2026-05-29"
    method: GET
    url: https://tenders.procurement.gov.ge/public/library/controller.php
    action: application
    params:
      - {name: action,  required: true,  default: application, note: fixed}
      - {name: app_id,  required: true,  default: null, note: tender id}
      - {name: app_reg, required: false, default: "",   note: empty}
      - {name: key,     required: false, default: "",   note: "site JS sends key=undefined"}
    response:
      format: html_fragment
      note: >
        Builds the jQuery UI tab strip (#application_tabs). Fired by ShowApp(app_id,'',tabIdx)
        where tabIdx 0=main,1=docs,2=bids,3=results,4=contract. Use it to read which tabs a
        tender exposes (state-dependent). The tab strip also shows the buyer name as a
        javascript:void(0) pseudo-link; the contract summary exposes ShowProfile(<org_id>).
    empty_state: n/a
    error_state: "invalid app_id -> PHP 'Undefined offset: 0' (line 140), not a 404"
    fixture: data/discovery/application_656756.html

  - id: agr_docs        # ხელშეკრულება (contract + payments)
    status: documented
    last_verified: "2026-05-29"
    method: GET
    url: https://tenders.procurement.gov.ge/public/library/controller.php
    action: agr_docs
    session_note: >
      Works directly in a lang-initialized session (GET /?lang=ge first). No per-tender
      priming via action=application is needed (verified headless 2026-05-28). A PHP
      'Undefined index: lang' error (controller.php line 8) only appears when the session
      lang state is missing (stale/rotated cookie) — re-init the session to fix.
    params:
      - {name: action, required: true, default: agr_docs, note: fixed}
      - {name: app_id, required: true, default: null,     note: tender id}
      # NOTE: site sends NO key param for agr_docs (unlike other tabs which send key=undefined)
    response:
      format: html_fragment
      wrapper: "div#agency_docs  (SAME wrapper id as agency_docs/results — quirk; distinguish by content)"
      div_0: "ui-state-highlight - contract summary: status label (e.g. 'მიმდინარე ხელშეკრულება'; agrfg* class), author::date, a days-to-expiry countdown ('<N> დღე ...ვადის ამოწურვამდე'), supplier (ShowProfile link), 'ნომერი/თანხა: N../.. / <amount> ლარი' (convertme span carries numeric amount+currency), validity dates, contract date"
      div_1: "pad4px - table#last_docs documents list. Contract file link = files.php?mode=contract&file=<id> (NO code param); files inside the list still use mode=app&file=&code="
      div_2: "ui-state-highlight (div:last-of-type) - ფაქტობრივი გადახდები: summary line 'ხელშეკრულების თანხა: X' + 'გადახდილი თანხა: Y (Z%)', then payment table (amount[+funding source, may be (ავანსი)] | year | quarter | pay date | date/author)"
