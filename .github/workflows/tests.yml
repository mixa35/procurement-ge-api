name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.13 guards the upgrade path.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the client and its test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # The suite is fixture-backed and makes no live portal calls, so CI never
      # touches tenders.procurement.gov.ge.
      - name: Run tests
        run: python -m pytest -q
